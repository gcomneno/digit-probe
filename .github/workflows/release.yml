name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v1.0.0"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Verify checked-out tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TAG_TARGET="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")"
          HEAD_TARGET="$(git rev-parse HEAD)"

          echo "RELEASE_TAG=$RELEASE_TAG"
          echo "TAG_TARGET=$TAG_TARGET"
          echo "HEAD_TARGET=$HEAD_TARGET"

          test "$TAG_TARGET" = "$HEAD_TARGET"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(
            python - <<'PYVERSION'
import tomllib
from pathlib import Path

data = tomllib.loads(Path("pyproject.toml").read_text())
print(data["project"]["version"])
PYVERSION
          )"

          EXPECTED_TAG="v${PACKAGE_VERSION}"

          echo "RELEASE_TAG=$RELEASE_TAG"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          echo "EXPECTED_TAG=$EXPECTED_TAG"

          test "$RELEASE_TAG" = "$EXPECTED_TAG"

      - name: Verify GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json tagName,isDraft,isPrerelease,url \
            --jq '{
              tagName,
              isDraft,
              isPrerelease,
              url
            }'

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Show artifact hashes
        run: sha256sum dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release distributions to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/digit-probe/

    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Show artifact hashes
        run: sha256sum dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
